<style>
:root{
    --bg:#f7f8fa;
    --text:#222;
    --card-bg:#fff;
    --border:#e5e7eb;
    --tab-bg:#e9edf4;
    --tab-text:#444;
    --muted:#666;
    --muted2:#555;
    --muted3:#888;
    --accent:#4080ff;
    --accent-hover:#2968e0;
    --input-bg:#fff;
    --status-checking-bg:#f0f0f0; --status-checking-text:#666;
    --status-online-bg:#dcfce7;  --status-online-text:#166534;
    --status-offline-bg:#fee2e2; --status-offline-text:#991b1b;
    --status-error-bg:#fef3c7;   --status-error-text:#92400e;
    --shadow:0 1px 2px rgba(0,0,0,.04);
}
html[data-theme="dark"]{
    --bg:#0f1217;
    --text:#e6e8eb;
    --card-bg:#181c23;
    --border:#2a2f38;
    --tab-bg:#262c36;
    --tab-text:#c6ccd6;
    --muted:#9aa3b2;
    --muted2:#b3bac6;
    --muted3:#8b93a1;
    --accent:#5b8cff;
    --accent-hover:#7aa2ff;
    --input-bg:#12151b;
    --status-checking-bg:#2a2f38; --status-checking-text:#9aa3b2;
    --status-online-bg:#0e2a1c;   --status-online-text:#5fd68c;
    --status-offline-bg:#331719;  --status-offline-text:#f29696;
    --status-error-bg:#33290f;    --status-error-text:#f0b94e;
    --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
    padding:20px;
    max-width:1200px;
    margin:0 auto;
    transition:background .2s,color .2s;
}
.hide{display:none !important;}
header{margin-bottom:24px;}
header h1{font-size:28px;margin-bottom:8px;}
.header-meta{
    font-size:14px;color:var(--muted);margin-bottom:12px;
}
.nav-bar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.nav-bar button{
    padding:8px 16px;border:none;border-radius:8px;
    background:var(--accent);color:#fff;cursor:pointer;font-size:15px;
    display:inline-flex;align-items:center;gap:6px;
}
.nav-bar button:hover{background:var(--accent-hover);}
#themeBtn{width:40px;padding:8px 0;justify-content:center;gap:0;}
.toolbar{display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap;}
#searchInput{
    flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:15px;
    background:var(--input-bg);color:var(--text);
}
.offline-btn{
    padding:10px 16px;font-size:14px;border:1px solid var(--border);border-radius:8px;
    background:var(--card-bg);color:var(--muted);cursor:pointer;font-family:inherit;white-space:nowrap;
}
.offline-btn:hover{border-color:var(--accent);color:var(--accent);}
.offline-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
#tabsWrap,#catTabsWrap{
    display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;
}
.tab-item{
    padding:7px 14px;background:var(--tab-bg);border-radius:6px;cursor:pointer;font-size:14px;
    border:none;font-family:inherit;color:var(--tab-text);
}
.tab-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.tab-item.active{background:var(--accent);color:#fff;}
#linksContainer{
    display:grid;
    grid-template-columns: repeat(auto-fill,minmax(280px,1fr));
    gap:16px;
}
.link-card{
    background:var(--card-bg);padding:16px;border-radius:10px;border:1px solid var(--border);
    box-shadow:var(--shadow);
}
.card-header{
    display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;
}
.avatar{
    width:32px;height:32px;border-radius:6px;object-fit:cover;
}
.link-title{font-weight:600;font-size:16px;}
.status-tag{
    font-size:12px;padding:2px 8px;border-radius:4px;margin-left:auto;
}
.status-checking{background:var(--status-checking-bg);color:var(--status-checking-text);}
.status-online{background:var(--status-online-bg);color:var(--status-online-text);}
.status-offline{background:var(--status-offline-bg);color:var(--status-offline-text);}
.status-error{background:var(--status-error-bg);color:var(--status-error-text);}
.link-desc{font-size:14px;color:var(--muted2);margin-bottom:6px;min-height:40px;}
.link-url{font-size:13px;color:var(--accent);word-break:break-all;text-decoration:none;display:block;margin-bottom:6px;}
.card-footer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px;}
.year-mark{font-size:12px;color:var(--muted3);}
.status-detail{font-size:11px;color:var(--muted3);margin-top:4px;}
.refresh-btn{
    margin-left:auto;padding:4px 10px;font-size:12px;border:1px solid var(--border);
    border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;font-family:inherit;
    display:inline-flex;align-items:center;justify-content:center;
}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent);}
.copy-btn{
    padding:4px 12px;font-size:12px;border:1px solid var(--border);
    border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;font-family:inherit;
}
.copy-btn:hover{border-color:var(--accent);color:var(--accent);}
.copy-btn.copied{color:#fff;background:var(--status-online-text);border-color:var(--status-online-text);}
.apply-box{
    background:var(--card-bg);padding:20px;border-radius:10px;border:1px solid var(--border);max-width:600px;
}
.apply-box .form-item{margin-bottom:14px;}
.apply-box label{display:block;margin-bottom:4px;font-size:14px;}
.apply-box input,.apply-box textarea{
    width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;font-size:14px;
    background:var(--input-bg);color:var(--text);
}
#sendMailBtn{
    padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;
}
#sendMailBtn:hover{background:var(--accent-hover);}
#sendMailBtn:disabled{opacity:.6;cursor:not-allowed;}
.form-msg{margin-top:10px;font-size:14px;display:none;}
.form-msg.ok{color:var(--status-online-text);}
.form-msg.err{color:var(--status-offline-text);}
.empty-tip{grid-column:1/-1;color:var(--muted3);text-align:center;padding:40px 0;}
.hp-wrap{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;}
.static-list{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:16px;}
.static-list p{margin-bottom:10px;color:var(--muted);}
.static-list ul{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;}
.static-list li{font-size:14px;color:var(--muted2);word-break:break-all;}
.static-list a{color:var(--accent);text-decoration:none;}
</style>
</head>

function getObserver(){
    if(!imgObserver && window.IntersectionObserver){
        imgObserver = new IntersectionObserver((entries, obs)=>{
            entries.forEach(entry=>{
                if(entry.isIntersecting){
                    const img = entry.target;
                    attachAvatarFallback(img);
                    img.src = img.dataset.src;
                    img.removeAttribute('data-src');
                    obs.unobserve(img);
                }
            })
        })
    }
    return imgObserver;
}

function applyTheme(dark){
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    themeBtn.innerHTML = dark ? ICON_SUN : ICON_MOON;
}
function initTheme(){
    const saved = localStorage.getItem('link_theme');
    const dark = saved ? saved === 'dark'
        : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    applyTheme(dark);
}
themeBtn.addEventListener('click', ()=>{
    const dark = document.documentElement.getAttribute('data-theme') !== 'dark';
    applyTheme(dark);
    localStorage.setItem('link_theme', dark ? 'dark' : 'light');
});
initTheme();

function getStatusCache(){
    const raw = localStorage.getItem(CACHE_KEY);
    if(!raw) return {};
    try{ return JSON.parse(raw); }catch(e){ return {}; }
}
function setStatusCache(cache){
    localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
}

async function getSiteStatus(url, force){
    const cache = getStatusCache();
    const now = Date.now();
    if(!force && cache[url] && (now - cache[url].time) < STATUS_CACHE_TTL){
        return Object.assign({}, cache[url], { fromCache: true });
    }
    const started = performance.now();
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), 10000);
    let ms = null;
    try {
        const res = await fetch(PROXY_API + encodeURIComponent(url), { signal: controller.signal });
        if(!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        ms = Math.round(performance.now() - started);
        cache[url] = {
            alive: data.alive === true,
            error: false,
            ms: ms,
            time: now
        };
    }catch(err){
        console.error("检测接口异常", url, err);
        ms = Math.round(performance.now() - started);
        // 检测失败也写缓存（同样 TTL），避免刷新后反复请求
        cache[url] = {
            alive: false,
            error: true,
            ms: ms,
            time: now
        };
    }finally{
        clearTimeout(timer);
    }
    setStatusCache(cache);
    return Object.assign({}, cache[url], { fromCache: false });
}

// 检测结果完成一轮后，让"只看失联"筛选与失联排后实时更新（300ms 防抖，避免频繁重建）
let refreshTimer = null;
function scheduleRefresh(){
    if(refreshTimer) return;
    refreshTimer = setTimeout(()=>{
        refreshTimer = null;
        renderLinks();
    }, 300);
}

async function updateCardStatus(card, url, currentVer, force){
    const status = await getSiteStatus(url, force);
    if(renderVersion !== currentVer) return;
    const statusTag = card.querySelector('.status-tag');
    if(status.alive){
        statusTag.className = "status-tag status-online";
        statusTag.innerText = "在线";
    }else if(status.error){
        statusTag.className = "status-tag status-error";
        statusTag.innerText = "检测失败";
    }else{
        statusTag.className = "status-tag status-offline";
        statusTag.innerText = "失联";
    }
    const detail = card.querySelector('.status-detail');
    if(detail){
        const t = new Date(status.time);
        const hm = `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
        detail.innerText = (status.ms != null) ? `最近检测 ${hm} · ${status.ms}ms` : `最近检测 ${hm}`;
    }
    if(!status.fromCache){
        scheduleRefresh();
    }
}

function initTabs(container, options, stateKey){
    container.innerHTML = '';
    container.setAttribute('role','tablist');

    function makeTab(value, label, active){
        const tab = document.createElement('button');
        tab.type = 'button';
        tab.className = "tab-item" + (active ? " active" : "");
        tab.dataset.value = value;
        tab.setAttribute('role','tab');
        tab.setAttribute('aria-selected', active ? 'true' : 'false');
        tab.tabIndex = active ? 0 : -1;
        tab.innerText = label;
        return tab;
    }

    const tabs = options.map((opt, idx)=>{
        const active = filterState[stateKey] === opt.value ||
                       (filterState[stateKey] === 'all' && idx === 0);
        return makeTab(opt.value, opt.label, active);
    });
    tabs.forEach(t=>container.appendChild(t));

    function selectTab(tab){
        tabs.forEach(t=>{
            t.classList.remove('active');
            t.setAttribute('aria-selected','false');
            t.tabIndex = -1;
        });
        tab.classList.add('active');
        tab.setAttribute('aria-selected','true');
        tab.tabIndex = 0;
        filterState[stateKey] = tab.dataset.value;
        renderLinks();
    }

    tabs.forEach((tab, i)=>{
        tab.addEventListener('click', ()=>selectTab(tab));
        tab.addEventListener('keydown', e=>{
            let next = null;
            if(e.key === 'ArrowRight' || e.key === 'ArrowDown'){
                next = tabs[(i + 1) % tabs.length];
            }else if(e.key === 'ArrowLeft' || e.key === 'ArrowUp'){
                next = tabs[(i - 1 + tabs.length) % tabs.length];
            }
            if(next){
                e.preventDefault();
                next.focus();
                selectTab(next);
            }
        });
    });
}

function initAllTabs(){
    const cats = [...new Set(linksData.map(d=>d.category))];
    initTabs(catTabsWrap, [{value:'all',label:'全部'}].concat(cats.map(c=>({value:c,label:c}))), 'cat');
    const years = [...new Set(linksData.map(d=>d.joinYear))].sort((a,b)=>b-a);
    initTabs(tabsWrap, [{value:'all',label:'全部'}].concat(years.map(y=>({value:String(y),label:`${y}`}))), 'year');
}

// 头像加载失败 → 先尝试站点根路径 /favicon.ico，再落到占位图
function attachAvatarFallback(imgEl){
    imgEl.onerror = ()=>{
        imgEl.onerror = null;
        const site = imgEl.dataset.site;
        if(site){
            try{
                imgEl.src = new URL(site).origin + '/favicon.ico';
                imgEl.onerror = ()=>{ imgEl.onerror = null; imgEl.src = FALLBACK_AVATAR; };
                return;
            }catch(e){}
        }
        imgEl.src = FALLBACK_AVATAR;
    };
}

// 复制友链代码（Markdown 格式，供对方站点直接使用）
function buildLinkCode(item){
    return `[${item.name}](${item.url})`;
}
// 通用复制：写入剪贴板，按钮短暂显示"已复制"（兼容无剪贴板 API 的环境）
function copyText(text, btn){
    const done = ()=>{
        const old = btn.innerHTML;
        btn.disabled = true;
        btn.innerText = "已复制";
        setTimeout(()=>{ btn.innerHTML = old; btn.disabled = false; }, 1500);
    };
    const fallback = ()=>{
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try{ document.execCommand('copy'); done(); }
        catch(e){ alert("复制失败，请手动复制"); }
        document.body.removeChild(ta);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
        // 部分环境下剪贴板 API 可能挂起，800ms 无结果则走兼容回退
        Promise.race([
            navigator.clipboard.writeText(text).then(done),
            new Promise((resolve, reject)=>setTimeout(()=>reject(new Error("clipboard timeout")), 800))
        ]).catch(fallback);
    }else{
        fallback();
    }
}
function copyLink(item, btn){
    copyText(buildLinkCode(item), btn);
}

// 状态排序分：在线=0，未检测=1，失联/检测失败=2
function statusScore(cache, url){
    const s = cache[url];
    if(!s) return 1;
    return s.alive ? 0 : 2;
}

function renderLinks(){
    const currentVer = ++renderVersion;

    let arr = linksData;
    if(filterState.cat !== 'all'){
        arr = arr.filter(d=>d.category === filterState.cat);
    }
    if(filterState.year !== 'all'){
        arr = arr.filter(d=>d.joinYear === Number(filterState.year));
    }
    if(filterState.keyword.trim()){
        const kw = filterState.keyword.toLowerCase();
        arr = arr.filter(d=>
            d.name.toLowerCase().includes(kw) ||
            d.url.toLowerCase().includes(kw) ||
            d.desc.toLowerCase().includes(kw)
        )
    }
    const cache = getStatusCache();
    if(filterState.offlineOnly){
        arr = arr.filter(d=>{
            const s = cache[d.url];
            return s && !s.alive;
        });
    }else{
        // 失联/检测失败自动排后（稳定排序，未检测的保持原顺序）
        arr = arr.slice().sort((a,b)=>statusScore(cache,a.url) - statusScore(cache,b.url));
    }
    linksContainer.innerHTML = '';

    if(arr.length === 0){
        const tip = document.createElement('div');
        tip.className = "empty-tip";
        tip.innerText = filterState.offlineOnly ? "当前没有失联的友链" : "没有找到匹配的友链";
        linksContainer.appendChild(tip);
        return;
    }

    const observer = getObserver();

    for(const item of arr){
        const card = document.createElement('div');
        card.className = "link-card";
        card.innerHTML = `
        <div class="card-header">
            <img class="avatar" data-src="${escapeHtml(item.avatar)}" alt="${escapeHtml(item.name)}" data-site="${escapeHtml(item.url)}">
            <span class="link-title">${escapeHtml(item.name)}</span>
            <span class="status-tag status-checking">检测中</span>
        </div>
        <div class="link-desc">${escapeHtml(item.desc)}</div>
        <a class="link-url" target="_blank" rel="noopener noreferrer" href="${escapeHtml(item.url)}">${escapeHtml(item.url)}</a>
        <div class="card-footer">
            <span class="year-mark">加入：${item.joinYear} · ${escapeHtml(item.category)}</span>
            <button type="button" class="refresh-btn" title="重新检测状态">${ICON_REFRESH}</button>
            <button type="button" class="copy-btn">复制友链</button>
        </div>
        <div class="status-detail"></div>
        `;
        linksContainer.appendChild(card);

        const imgEl = card.querySelector('.avatar[data-src]');
        const loadAvatar = ()=>{
            attachAvatarFallback(imgEl);
            imgEl.src = imgEl.dataset.src;
            imgEl.removeAttribute('data-src');
        };
        if(observer){
            observer.observe(imgEl);
        }else{
            loadAvatar();
        }

        const copyBtn = card.querySelector('.copy-btn');
        copyBtn.addEventListener('click', ()=>copyLink(item, copyBtn));

        const refreshBtn = card.querySelector('.refresh-btn');
        refreshBtn.addEventListener('click', ()=>{
            const tag = card.querySelector('.status-tag');
            tag.className = "status-tag status-checking";
            tag.innerText = "检测中";
            updateCardStatus(card, item.url, renderVersion, true);
        });

        updateCardStatus(card, item.url, currentVer);
    }
}

function escapeHtml(str){
    if(!str) return '';
    return String(str)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
}

let searchTimer = null;
searchInput.addEventListener('input',()=>{
    clearTimeout(searchTimer);
    searchTimer = setTimeout(()=>{
        filterState.keyword = searchInput.value;
        renderLinks();
    }, 250);
})

// 只看失联切换
const offlineBtn = document.getElementById('offlineBtn');
offlineBtn.addEventListener('click', ()=>{
    filterState.offlineOnly = !filterState.offlineOnly;
    offlineBtn.classList.toggle('active', filterState.offlineOnly);
    offlineBtn.innerText = filterState.offlineOnly ? "只看失联（已开启）" : "只看失联";
    renderLinks();
});

// 复制全部友链（Markdown 列表）
document.querySelector('.btn-copyall').addEventListener('click', ()=>{
    const text = linksData.map(d=>`[${d.name}](${d.url})`).join('\n');
    copyText(text, document.querySelector('.btn-copyall'));
});

// 归一化网址用于查重：去协议、去末尾斜杠、小写
function normalizeUrl(u){
    return String(u).replace(/\/+$/,'').replace(/^https?:\/\//i,'').toLowerCase();
}

document.getElementById('sendMailBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('siteName').value.trim();
    const url = document.getElementById('siteUrl').value.trim();
    const desc = document.getElementById('siteDesc').value.trim();
    const avatar = document.getElementById('siteAvatar').value.trim();
    const contact = document.getElementById('contactMail').value.trim();
    const btn = document.getElementById('sendMailBtn');
    const msg = document.getElementById('formMsg');
    if(!name || !url){
        alert("请填写站点名称和网站地址");
        return;
    }
    if(!/^https?:\/\/.+/i.test(url)){
        alert("网站地址需以 http:// 或 https:// 开头");
        return;
    }
    if(contact && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact)){
        alert("联系邮箱格式不正确");
        return;
    }

    // 蜜罐防垃圾：隐藏字段被填写则静默丢弃
    if(document.getElementById('hpField').value.trim()){
        return;
    }
    // 提交间隔限制（30 秒内只能提交一次）
    const lastSubmit = localStorage.getItem('link_last_submit');
    if(lastSubmit && (Date.now() - Number(lastSubmit)) < 30000){
        alert("提交过于频繁，请稍后再试");
        return;
    }

    // 查重：已在友链列表中的网站不允许重复申请
    const dup = linksData.find(d=>normalizeUrl(d.url) === normalizeUrl(url));
    if(dup){
        alert(`该网站已在友链列表中（${dup.name}）`);
        return;
    }

    // 已配置提交接口：POST（JSON）到后端 / Formspree
    if(SUBMIT_URL){
        localStorage.setItem('link_last_submit', String(Date.now()));
        btn.disabled = true;
        msg.className = "form-msg";
        msg.style.display = "none";
        try{
            const res = await fetch(SUBMIT_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Accept": "application/json" },
                body: JSON.stringify({ name, url, desc, avatar, contact })
            });
            if(res.ok){
                msg.className = "form-msg ok";
                msg.innerText = "申请已提交，感谢！站长审核后会与你联系。";
                ['siteName','siteUrl','siteDesc','siteAvatar','contactMail'].forEach(id=>{
                    document.getElementById(id).value = '';
                });
            }else{
                msg.className = "form-msg err";
                msg.innerText = "提交失败（HTTP " + res.status + "），请稍后重试或改用邮件联系。";
            }
        }catch(err){
            console.error("申请提交异常", err);
            msg.className = "form-msg err";
            msg.innerText = "提交失败，请检查网络后重试，或改用邮件联系。";
        }
        msg.style.display = "block";
        btn.disabled = false;
        return;
    }

    // 未配置接口：回退 mailto 邮件客户端方式
    if(ADMIN_EMAIL === "your@example.com"){
        alert("管理员邮箱尚未配置，请修改 index.html 中的 ADMIN_EMAIL 后使用该功能");
        return;
    }
    const subject = `友链申请 - ${name}`;
    const body = `友链交换申请
站点名称：${name}
网站地址：${url}
站点简介：${desc}
站点头像：${avatar}
申请人邮箱：${contact}

我方已添加贵站友链，请审核！`;
    localStorage.setItem('link_last_submit', String(Date.now()));
    const mailto = `mailto:${ADMIN_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    window.location.href = mailto;
})

fillMetaInfo();
initAllTabs();
renderLinks();
</script>
