<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRDLINK</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:#f7f8fa;
    color:#222;
    line-height:1.6;
    padding:20px;
    max-width:1200px;
    margin:0 auto;
}
.hide{display:none !important;}
header{margin-bottom:24px;}
header h1{font-size:28px;margin-bottom:8px;}
.header-meta{
    font-size:14px;color:#666;margin-bottom:12px;
}
.nav-bar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.nav-bar button{
    padding:8px 16px;border:none;border-radius:8px;
    background:#4080ff;color:#fff;cursor:pointer;font-size:15px;
}
.nav-bar button:hover{background:#2968e0;}
#searchInput{
    width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:15px;margin-bottom:16px;
}
#tabsWrap{
    display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;
}
.tab-item{
    padding:7px 14px;background:#e9edf4;border-radius:6px;cursor:pointer;font-size:14px;
    border:none;font-family:inherit;
}
.tab-item:focus-visible{outline:2px solid #4080ff;outline-offset:2px;}
.tab-item.active{background:#4080ff;color:#fff;}
#linksContainer{
    display:grid;
    grid-template-columns: repeat(auto-fill,minmax(280px,1fr));
    gap:16px;
}
.link-card{
    background:#fff;padding:16px;border-radius:10px;border:1px solid #e5e7eb;
}
.card-header{
    display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;
}
.avatar{
    width:32px;height:32px;border-radius:6px;object-fit:cover;
}
.link-title{font-weight:600;font-size:16px;}
.status-tag{
    font-size:12px;padding:2px 8px;border-radius:4px;margin-left:auto;
}
.status-checking{background:#f0f0f0;color:#666;}
.status-online{background:#dcfce7;color:#166534;}
.status-offline{background:#fee2e2;color:#991b1b;}
.status-error{background:#fef3c7;color:#92400e;}
.link-desc{font-size:14px;color:#555;margin-bottom:6px;min-height:40px;}
.link-url{font-size:13px;color:#4080ff;word-break:break-all;text-decoration:none;display:block;margin-bottom:6px;}
.year-mark{font-size:12px;color:#888;}

.apply-box{
    background:#fff;padding:20px;border-radius:10px;border:1px solid #e5e7eb;max-width:600px;
}
.apply-box .form-item{margin-bottom:14px;}
.apply-box label{display:block;margin-bottom:4px;font-size:14px;}
.apply-box input,.apply-box textarea{
    width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px;
}
#sendMailBtn{
    padding:10px 20px;background:#4080ff;color:#fff;border:none;border-radius:6px;cursor:pointer;
}
</style>
</head>
<body>
<header>
    <h1>FRDLINK</h1>
    <div class="header-meta">
        <span id="totalCount"></span> &nbsp;|&nbsp;
        <span id="editTime"></span>
    </div>
    <div class="nav-bar">
        <button class="btn-home"><i class="fa fa-home"></i> 首页</button>
        <button class="btn-apply"><i class="fa fa-paper-plane"></i> 申请友链</button>
    </div>
</header>

<section id="home-section">
    <input id="searchInput" placeholder="搜索站点名称、网址、简介...">
    <div id="tabsWrap"></div>
    <div id="linksContainer"></div>
</section>

<section id="apply-section" class="hide">
    <div class="apply-box">
        <div class="form-item">
            <label>站点名称</label>
            <input id="siteName" placeholder="例如：杜老师说">
        </div>
        <div class="form-item">
            <label>网站地址</label>
            <input id="siteUrl" placeholder="https://xxx.com">
        </div>
        <div class="form-item">
            <label>站点简介</label>
            <textarea id="siteDesc" rows="3" placeholder="简单描述你的博客"></textarea>
        </div>
        <div class="form-item">
            <label>站点头像URL</label>
            <input id="siteAvatar" placeholder="https://xxx/favicon.ico">
        </div>
        <div class="form-item">
            <label>你的联系邮箱</label>
            <input id="contactMail" placeholder="用于接收回复">
        </div>
        <button id="sendMailBtn">一键发送邮件申请</button>
    </div>
</section>

<script src="./links.js"></script>
<script>
// ====================== 站点配置（部署前请核对） ======================
// 注意：API_KEY 写在静态页面源码中，任何访客都能直接看到并提取，
// 这是静态站点直连第三方检测接口的固有限制。若该接口有配额或费用，
// 请务必改为服务端代理转发（前端只调用不含 key 的接口）。
const API_KEY = "Weas2026Nocss@888";
const PROXY_API = "https://nocss.xyz/link_checker.php?action=check&key="+API_KEY+"&url=";
const ADMIN_EMAIL = "your@example.com"; // TODO: 上线前替换为真实收件邮箱，否则申请邮件无法送达
// ================================================================

const STATUS_CACHE_TTL = 20 * 60 * 1000;
const CACHE_KEY = "link_status_cache";
// 头像加载失败的兜底占位图（内联 SVG，无外部依赖）
const FALLBACK_AVATAR = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23e9edf4'/%3E%3Ctext x='16' y='22' font-size='15' text-anchor='middle' fill='%23888'%3E?%3C/text%3E%3C/svg%3E";

const homeSection = document.getElementById('home-section');
const applySection = document.getElementById('apply-section');
const tabsWrap = document.getElementById('tabsWrap');
const linksContainer = document.getElementById('linksContainer');
const searchInput = document.getElementById('searchInput');
const totalCountEl = document.getElementById('totalCount');
const editTimeEl = document.getElementById('editTime');

let renderVersion = 0;
let imgObserver = null;

// 格式化日期 YYYY‑MM‑DD → xxxx年x月x日
function formatDate(str){
    if(!str) return '';
    const arr = str.split('-');
    const y = arr[0], m = arr[1], d = arr[2];
    return `${y}年${Number(m)}月${Number(d)}日`;
}

// 填充元信息：总条数、最后编辑时间
function fillMetaInfo(){
    totalCountEl.innerText = `共 ${linksData.length} 条友链`;
    if(linkMeta && linkMeta.lastEdit){
        editTimeEl.innerText = `最后编辑于 ${formatDate(linkMeta.lastEdit)}`;
    }
}

function getObserver(){
    if(!imgObserver && window.IntersectionObserver){
        imgObserver = new IntersectionObserver((entries, obs)=>{
            entries.forEach(entry=>{
                if(entry.isIntersecting){
                    const img = entry.target;
                    img.onerror = ()=>{
                        img.onerror = null;
                        img.src = FALLBACK_AVATAR;
                    };
                    img.src = img.dataset.src;
                    img.removeAttribute('data-src');
                    obs.unobserve(img);
                }
            })
        })
    }
    return imgObserver;
}

document.querySelector('.btn-home').addEventListener('click', e=>{
    e.preventDefault();
    homeSection.classList.remove('hide');
    applySection.classList.add('hide');
});
document.querySelector('.btn-apply').addEventListener('click', e=>{
    e.preventDefault();
    homeSection.classList.add('hide');
    applySection.classList.remove('hide');
});

function getStatusCache(){
    const raw = localStorage.getItem(CACHE_KEY);
    if(!raw) return {};
    try{ return JSON.parse(raw); }catch(e){ return {}; }
}
function setStatusCache(cache){
    localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
}

async function getSiteStatus(url){
    const cache = getStatusCache();
    const now = Date.now();
    if(cache[url] && (now - cache[url].time) < STATUS_CACHE_TTL){
        return cache[url];
    }
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), 10000);
    try {
        const res = await fetch(PROXY_API + encodeURIComponent(url), { signal: controller.signal });
        if(!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        cache[url] = {
            alive: data.alive === true,
            error: false,
            time: now
        };
    }catch(err){
        console.error("检测接口异常", url, err);
        // 检测失败也写缓存（同样 TTL），避免刷新后反复请求
        cache[url] = {
            alive: false,
            error: true,
            time: now
        };
    }finally{
        clearTimeout(timer);
    }
    setStatusCache(cache);
    return cache[url];
}

async function updateCardStatus(card, url, currentVer){
    const status = await getSiteStatus(url);
    if(renderVersion !== currentVer) return;
    const statusTag = card.querySelector('.status-tag');
    if(status.alive){
        statusTag.className = "status-tag status-online";
        statusTag.innerText = "在线";
    }else if(status.error){
        statusTag.className = "status-tag status-error";
        statusTag.innerText = "检测失败";
    }else{
        statusTag.className = "status-tag status-offline";
        statusTag.innerText = "失联";
    }
}

function initTabs(){
    const years = [...new Set(linksData.map(item=>item.joinYear))].sort((a,b)=>b-a);
    tabsWrap.innerHTML = '';
    tabsWrap.setAttribute('role','tablist');

    function makeTab(year, label, active){
        const tab = document.createElement('button');
        tab.type = 'button';
        tab.className = "tab-item" + (active ? " active" : "");
        tab.dataset.year = year;
        tab.setAttribute('role','tab');
        tab.setAttribute('aria-selected', active ? 'true' : 'false');
        tab.tabIndex = active ? 0 : -1;
        tab.innerText = label;
        return tab;
    }

    const tabs = [makeTab("all", "全部", true)];
    years.forEach(y=>{
        tabs.push(makeTab(String(y), `${y}`, false));
    });
    tabs.forEach(t=>tabsWrap.appendChild(t));

    function selectTab(tab){
        tabs.forEach(t=>{
            t.classList.remove('active');
            t.setAttribute('aria-selected','false');
            t.tabIndex = -1;
        });
        tab.classList.add('active');
        tab.setAttribute('aria-selected','true');
        tab.tabIndex = 0;
        renderLinks(tab.dataset.year);
    }

    tabs.forEach((tab, i)=>{
        tab.addEventListener('click', ()=>selectTab(tab));
        tab.addEventListener('keydown', e=>{
            let next = null;
            if(e.key === 'ArrowRight' || e.key === 'ArrowDown'){
                next = tabs[(i + 1) % tabs.length];
            }else if(e.key === 'ArrowLeft' || e.key === 'ArrowUp'){
                next = tabs[(i - 1 + tabs.length) % tabs.length];
            }
            if(next){
                e.preventDefault();
                next.focus();
                selectTab(next);
            }
        });
    });
}

function renderLinks(filterYear="all", keyword=""){
    const currentVer = ++renderVersion;

    let arr = linksData;
    if(filterYear !== "all"){
        arr = arr.filter(d=>d.joinYear === Number(filterYear));
    }
    if(keyword.trim()){
        const kw = keyword.toLowerCase();
        arr = arr.filter(d=>
            d.name.toLowerCase().includes(kw) ||
            d.url.toLowerCase().includes(kw) ||
            d.desc.toLowerCase().includes(kw)
        )
    }
    linksContainer.innerHTML = '';
    const observer = getObserver();

    for(const item of arr){
        const card = document.createElement('div');
        card.className = "link-card";
        card.innerHTML = `
        <div class="card-header">
            <img class="avatar" data-src="${escapeHtml(item.avatar)}" alt="${escapeHtml(item.name)}">
            <span class="link-title">${escapeHtml(item.name)}</span>
            <span class="status-tag status-checking">检测中</span>
        </div>
        <div class="link-desc">${escapeHtml(item.desc)}</div>
        <a class="link-url" target="_blank" rel="noopener noreferrer" href="${escapeHtml(item.url)}">${escapeHtml(item.url)}</a>
        <div class="year-mark">加入：${item.joinYear}</div>
        `;
        linksContainer.appendChild(card);

        const imgEl = card.querySelector('.avatar[data-src]');
        const loadAvatar = ()=>{
            imgEl.onerror = ()=>{
                imgEl.onerror = null;
                imgEl.src = FALLBACK_AVATAR;
            };
            imgEl.src = imgEl.dataset.src;
            imgEl.removeAttribute('data-src');
        };
        if(observer){
            observer.observe(imgEl);
        }else{
            loadAvatar();
        }
        updateCardStatus(card, item.url, currentVer);
    }
}

function escapeHtml(str){
    if(!str) return '';
    return String(str)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
}

let searchTimer = null;
searchInput.addEventListener('input',()=>{
    clearTimeout(searchTimer);
    searchTimer = setTimeout(()=>{
        const activeTab = tabsWrap.querySelector('.tab-item.active');
        renderLinks(activeTab.dataset.year, searchInput.value);
    }, 250);
})

document.getElementById('sendMailBtn').addEventListener('click',()=>{
    const name = document.getElementById('siteName').value.trim();
    const url = document.getElementById('siteUrl').value.trim();
    const desc = document.getElementById('siteDesc').value.trim();
    const avatar = document.getElementById('siteAvatar').value.trim();
    const contact = document.getElementById('contactMail').value.trim();
    if(!name || !url){
        alert("请填写站点名称和网站地址");
        return;
    }
    if(!/^https?:\/\/.+/i.test(url)){
        alert("网站地址需以 http:// 或 https:// 开头");
        return;
    }
    if(contact && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact)){
        alert("联系邮箱格式不正确");
        return;
    }
    if(ADMIN_EMAIL === "your@example.com"){
        alert("管理员邮箱尚未配置，请修改 index.html 中的 ADMIN_EMAIL 后使用该功能");
        return;
    }
    const subject = `友链申请 - ${name}`;
    const body = `友链交换申请
站点名称：${name}
网站地址：${url}
站点简介：${desc}
站点头像：${avatar}
申请人邮箱：${contact}

我方已添加贵站友链，请审核！`;
    const mailto = `mailto:${ADMIN_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    window.location.href = mailto;
})

fillMetaInfo();
initTabs();
renderLinks("all");
</script>
</body>
</html>
